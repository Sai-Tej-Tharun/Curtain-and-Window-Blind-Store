<!DOCTYPE html>
<html lang="en" class="auth-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Loom &amp; Light</title>
  <meta name="description" content="Log in to your Loom & Light account to track orders, saved fabrics and measurement appointments.">
  <link rel="icon" href="../global-images/favicon.ico">

  <link rel="icon" type="image/svg+xml" href="../global-images/logo-icon-light.png">
  <link rel="stylesheet" href="../global-css/global.css">
  <link rel="stylesheet" href="../components/navbar.css">
  <link rel="stylesheet" href="../components/footer.css">
  <link rel="stylesheet" href="login.css">
</head>
<body class="auth-body no-header-offset">

  <div class="auth-toolbar">
    <button type="button" class="auth-icon-btn" data-theme-toggle aria-label="Toggle dark mode" aria-pressed="false">
      <svg class="auth-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg class="auth-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
<button type="button" class="auth-icon-btn auth-icon-btn--text"
        data-rtl-toggle
        aria-label="Toggle right-to-left layout"
        aria-pressed="false">
  <span aria-hidden="true">RTL</span>
</button>
  </div>

  <main class="auth-page">



    <div class="auth-panel">
      <div class="card auth-card">
    <a href="../home-1/home-1.html" class="llnav__logo" aria-label="Loom & Light — home">
      <img class="llnav__logo-icon llnav__logo-icon--light" src="../global-images/logo-icon-light.png" alt="" width="40" height="40">
      <img class="llnav__logo-icon llnav__logo-icon--dark" src="../global-images/logo-icon-dark.png" alt="" width="40" height="40">
      <span class="llnav__logo-divider" aria-hidden="true"></span>
      <span class="llnav__logo-text">Loom<span class="llnav__logo-amp">&amp;</span>Light</span>
    </a>

        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Log in to manage your orders and appointments.</p>

        <form class="auth-form" data-form="login" novalidate>
          <div class="form-group">
            <label for="li-email" class="form-label">Email Address</label>
            <input type="email" id="li-email" name="email" class="form-input" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="li-password" class="form-label">Password</label>
            <div class="password-field">
              <input type="password" id="li-password" name="password" class="form-input" autocomplete="current-password" required minlength="8">
              <button type="button" class="password-toggle" data-password-toggle="li-password" aria-label="Show password">
                <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M17.9 17.9A10.7 10.7 0 0 1 12 19c-7 0-11-7-11-7a19.4 19.4 0 0 1 4.2-5.1M9.5 5.3A10 10 0 0 1 12 5c7 0 11 7 11 7a19.4 19.4 0 0 1-2.6 3.5M14.1 14.1a3 3 0 1 1-4.2-4.2M1 1l22 22"/></svg>
              </button>
            </div>
          </div>

          <div class="auth-row">
            <label class="checkbox-field">
              <input type="checkbox" name="remember" id="li-remember">
              <span>Remember me</span>
            </label>
            <a href="forgot-password.html" class="auth-link-sm">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-premium auth-submit">Log In</button>
          <p class="form-feedback" data-form-feedback aria-live="polite"></p>
        </form>

        <div class="auth-divider"><span>or continue with</span></div>

        <div class="auth-social">
          <button type="button" class="btn btn-outline auth-social-btn">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/>
              <path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.9.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18z"/>
              <path fill="#FBBC05" d="M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8l3-2.3z"/>
              <path fill="#EA4335" d="M9 3.6c1.3 0 2.5.4 3.4 1.3l2.6-2.6C13.5.9 11.4 0 9 0A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6z"/>
            </svg>
            Google
          </button>
          <button type="button" class="btn btn-outline auth-social-btn">
            <svg width="16" height="18" viewBox="0 0 14 17" aria-hidden="true">
              <path fill="currentColor" d="M11.6 9c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.6-1.3-.1-2.5.8-3.1.8-.6 0-1.6-.7-2.7-.7-1.4 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .7 1 1.5 2.1 2.6 2 1-.1 1.4-.7 2.7-.7s1.6.7 2.7.6c1.1 0 1.8-1 2.5-2 .8-1.1 1.1-2.2 1.1-2.3-.1 0-2.1-.8-2.3-3zM9.6 2.7c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.6 1.3-.5.6-1 1.6-.9 2.6 1 .1 2-.5 2.6-1.2z"/>
            </svg>
            Apple
          </button>
        </div>

        <p class="auth-switch">Don&rsquo;t have an account? <a href="register.html">Sign up</a></p>
      </div>
    </div>
  </main>

  <script src="../global-js/global.js"></script>
  <script src="../components/navbar.js"></script>
  <script src="../components/footer.js"></script>
  <script src="login.js"></script>
</body>
</html>
